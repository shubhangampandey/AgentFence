services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_USER: agentfence
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: agentfence
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentfence"]
      interval: 5s
      retries: 10
  opa:
    image: openpolicyagent/opa:1.21.2-static
    command: ["run", "--server", "--addr=0.0.0.0:8181", "/policies"]
    ports: ["127.0.0.1:8181:8181"]
    volumes: ["./infrastructure/opa:/policies:ro"]
volumes:
  pgdata:
